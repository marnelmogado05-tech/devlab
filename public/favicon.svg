<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="DevLab">
  <title>DevLab</title>
  <!--
    The mark: `dev/lab` reads as a path, and the slash is the character the name
    turns on. The plate is the interface's own 3px faceplate radius, scaled; the
    slash is knocked out of it rather than drawn on it.

    It inverts with the visitor's theme, which is the one thing a vector icon
    can do and a raster cannot — a light plate against a dark tab strip, a dark
    plate against a light one. The .ico and the touch icon have to pick, and
    they pick the dark plate; see resources/brand/build-icons.py.
  -->
  <style>
    .plate { fill: #1a212b }
    .slash { fill: #edf0f4 }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e4e9f0 }
      .slash { fill: #171d26 }
    }
  </style>
  <rect class="plate" width="48" height="48" rx="5"/>
  <path class="slash" d="M31 10H24.5L17 38h6.5z"/>
</svg>
