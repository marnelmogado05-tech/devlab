name: CI

# Scaffold. Every job no-ops until the application actually exists, so the first
# commits are not red. Remove the guard steps once composer.json / package.json land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PHP — lint, analyse, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devlab_test
          POSTGRES_USER: devlab
          POSTGRES_PASSWORD: devlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Is there an application yet?
        run: |
          if [ -f composer.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No composer.json — skipping backend checks (Phase 0)."
          fi

      - name: Set up PHP
        if: steps.guard.outputs.exists == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        if: steps.guard.outputs.exists == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        if: steps.guard.outputs.exists == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format check (Pint)
        if: steps.guard.outputs.exists == 'true'
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        if: steps.guard.outputs.exists == 'true'
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        if: steps.guard.outputs.exists == 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: devlab_test
          DB_USERNAME: devlab
          DB_PASSWORD: devlab
        run: php artisan migrate --force

      - name: Tests
        if: steps.guard.outputs.exists == 'true'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: devlab_test
          DB_USERNAME: devlab
          DB_PASSWORD: devlab
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  frontend:
    name: TypeScript — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Is there a frontend yet?
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — skipping frontend checks (Phase 0)."
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install
        if: steps.guard.outputs.exists == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.guard.outputs.exists == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.guard.outputs.exists == 'true'
        run: npm run build
