name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    services:
      # Tests run against PostgreSQL, not SQLite — DevLab's schema depends on
      # jsonb, GIN indexes and partial unique indexes. See phpunit.xml.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devlab_testing
          POSTGRES_USER: devlab
          POSTGRES_PASSWORD: change_me
        # Mapped off the default so the value matches phpunit.xml, which uses a
        # non-default port to coexist with a natively installed Postgres.
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # resources/js/{routes,actions,wayfinder} are generated, not committed, so
      # a fresh checkout has none of them and every `@/routes` import fails to
      # resolve. --with-form is required: vite.config.ts sets formVariants, and
      # without it the .form helpers are missing and the typecheck still fails.
      - name: Generate route helpers
        run: php artisan wayfinder:generate --with-form

      - name: Check formatting
        run: ./vendor/bin/pint --parallel --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Frontend lint
        run: npm run check

      - name: Typecheck
        run: npm run types:check

      # Frontend component tests (§38). They need no database or Redis, so they
      # run before the services are touched and fail fast.
      - name: Frontend tests
        run: npm run test

      # Before the tests, not after: the suite renders real Inertia pages, so it
      # needs public/build/manifest.json or every page returns 500.
      - name: Build assets
        run: npm run build

      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_DATABASE: devlab_testing
          DB_USERNAME: devlab
          DB_PASSWORD: change_me
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6380
        run: php artisan test
