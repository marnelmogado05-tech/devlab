# Build the production image and publish it to GitHub Container Registry.
#
# This exists because of where DevLab is meant to run. The image compiles its
# PHP extensions from source — Alpine has no prebuilt pdo_pgsql, intl or redis —
# which takes around twenty minutes and a gcc toolchain on a full developer
# machine. On the 1-vCPU always-free instances this deployment targets it would
# take far longer and would very likely be killed for memory.
#
# So the box never builds. CI builds, the registry stores, and the server pulls.
# That is also what makes `docker compose pull && up -d` a complete deploy.
#
# arm64 is built alongside amd64 because the most generous always-free tier
# (Oracle's Ampere instances) is ARM. It is emulated here and roughly doubles
# the run, which is an acceptable trade for a workflow that only fires on main.

name: Image

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        name: Build and publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # Emulation for the arm64 half of the manifest.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Sign in to the registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Lowercased because a registry path must be, and a GitHub owner
            # need not be.
            - name: Work out the image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Tag it
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/production/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Without this every run recompiles the extension toolchain
                  # from nothing.
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
