# DevLab local development environment.
#
# Deliberately five services. Anything else gets added when a feature needs it,
# not in advance (plan §24, §77). The Phase 3 sandbox is NOT here — it runs on
# isolated infrastructure with no route back into this network.

services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: devlab-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            # Keep container-installed dependencies out of the bind mount so a host
            # checkout on a different platform does not shadow them.
            - /var/www/html/vendor
            - /var/www/html/node_modules
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            # Inside the network, the standard ports always apply. The host-side
            # ports below are moved off the defaults to avoid colliding with a
            # natively installed Postgres or Redis, which is common on a
            # developer machine — so .env's DB_PORT is deliberately overridden.
            DB_HOST: postgres
            DB_PORT: 5432
            # The entrypoint's wait-for-database probe is a bare `php -r`, so it runs
            # before Laravel boots and never reads .env. It needs the credentials
            # from the container environment or it retries forever as an empty user.
            DB_DATABASE: '${DB_DATABASE:-devlab}'
            DB_USERNAME: '${DB_USERNAME:-devlab}'
            DB_PASSWORD: '${DB_PASSWORD:-change_me}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks: [devlab]

    queue:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: devlab-queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --tries=3 --max-time=3600 --backoff=5
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/node_modules
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            # The entrypoint's wait-for-database probe is a bare `php -r`, so it runs
            # before Laravel boots and never reads .env. It needs the credentials
            # from the container environment or it retries forever as an empty user.
            DB_DATABASE: '${DB_DATABASE:-devlab}'
            DB_USERNAME: '${DB_USERNAME:-devlab}'
            DB_PASSWORD: '${DB_PASSWORD:-change_me}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks: [devlab]

    vite:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: devlab-vite
        restart: unless-stopped
        working_dir: /var/www/html
        # Hot module reloading for the React frontend. Without this the app still
        # works — the entrypoint compiles assets on first boot — but every change
        # to resources/js needs a manual rebuild.
        #
        # --host 0.0.0.0 is not optional: a dev server bound to 127.0.0.1 inside
        # a container is unreachable from the host, whatever the port mapping says.
        #
        # Invoked directly rather than through `npm run dev` so that the entrypoint
        # can exec it as PID 1. Behind npm it never sees SIGTERM, so `docker compose
        # stop` leaves public/hot behind pointing at a dev server that is gone, and
        # the next boot serves a page whose assets all 404.
        command: ./node_modules/.bin/vp dev --host 0.0.0.0 --port 5173
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            # The Wayfinder plugin shells out to `php artisan` during dev to
            # regenerate the typed route helpers, so this container needs the same
            # connection settings the app has. It still does not wait for Postgres:
            # a frontend dev server must not be blocked by a database.
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE:-devlab}'
            DB_USERNAME: '${DB_USERNAME:-devlab}'
            DB_PASSWORD: '${DB_PASSWORD:-change_me}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
        networks: [devlab]

    postgres:
        image: postgres:17-alpine
        container_name: devlab-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-devlab}'
            POSTGRES_USER: '${DB_USERNAME:-devlab}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-change_me}'
            # Deterministic collation, so ORDER BY does not differ between machines.
            POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports:
            - '${DB_PORT_HOST:-5433}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # Creates devlab_testing on first boot — the test suite runs on Postgres,
            # not SQLite, and must not share a database with development data.
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-devlab} -d ${DB_DATABASE:-devlab}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks: [devlab]

    redis:
        image: redis:8-alpine
        container_name: devlab-redis
        restart: unless-stopped
        # Persist, so a restart does not silently empty the leaderboards before the
        # rebuild job runs. Redis is still never the source of truth (plan §23).
        command: redis-server --appendonly yes
        ports:
            - '${REDIS_PORT_HOST:-6380}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        networks: [devlab]

    # The execution orchestrator (ADR 0007). Phase 3.
    #
    # Behind a PROFILE, so it does not start with `docker compose up`. This is
    # the one service that holds container-creation privilege, and the default
    # development stack should not silently gain a privileged container because
    # somebody pulled main. Start it deliberately:
    #
    #     docker compose --profile execution up -d orchestrator
    #
    # It holds the Docker socket and nothing else — no database, no Redis, no
    # application code. A component that cannot reach the database cannot leak
    # it, however badly it is compromised.
    orchestrator:
        profiles: ['execution']
        build:
            context: .
            dockerfile: docker/orchestrator/Dockerfile
        container_name: devlab-orchestrator
        restart: unless-stopped
        environment:
            ORCHESTRATOR_PORT: 8090
            # gVisor is what S1 actually depends on, and it is not present on
            # Docker Desktop. Left empty here so a local stack runs the weaker
            # runc boundary KNOWINGLY — the /health endpoint reports which is in
            # use. See docs/security/sandbox-threat-model.md.
            SANDBOX_RUNTIME: '${SANDBOX_RUNTIME:-}'
            # How long a container may take to EXIST before the submission's own
            # clock starts. Tens of milliseconds on a Linux host; measured at 12
            # to 35 seconds on Docker Desktop under load, which is longer than
            # most submissions are allowed to run. Without a separate allowance
            # a slow machine looks exactly like hostile code.
            SANDBOX_START_ALLOWANCE_MS: '${SANDBOX_START_ALLOWANCE_MS:-25000}'
        volumes:
            # The privilege this whole architecture exists to contain. It is
            # here and nowhere else: no other service mounts it, and a test in
            # the suite asserts that.
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - '${ORCHESTRATOR_PORT_HOST:-8090}:8090'
        networks:
            - devlab

volumes:
    postgres-data:
    redis-data:

networks:
    devlab:
        driver: bridge
